services:
  gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pulsecrypto-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
      # Metrics bound to localhost only; in production this port is scraped from the cluster network.
      - "127.0.0.1:9464:9464"
    environment:
      - PORT=8080
      - METRICS_PORT=9464
      - FLUSH_INTERVAL_MS=100
      # Market-data-only hosts, e.g. where the main Binance hosts are restricted:
      # - BINANCE_WS_URL=wss://data-stream.binance.vision
      # - BINANCE_REST_URL=https://data-api.binance.vision
    stop_grace_period: 10s
